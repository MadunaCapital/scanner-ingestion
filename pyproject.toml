[project]
name = "maduna-scanner-ingestion"
version = "0.1.0"
description = "Shared scraper toolkit for the MadunaCapital arbitrage scanner: BaseScraper + the generic Redis publisher, consumed by per-bookmaker repos"
requires-python = ">=3.11"
dependencies = [
    "redis>=5.0",
    "maduna-scanner-schemas @ git+https://github.com/MadunaCapital/scanner-schemas.git#subdirectory=python",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
timeout = 15
asyncio_mode = "auto"
