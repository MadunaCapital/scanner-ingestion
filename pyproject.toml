[project]
name = "maduna-scanner-ingestion"
version = "0.1.0"
description = "Shared scraper toolkit for the MadunaCapital arbitrage scanner: BaseScraper plus optional anti-bot evasion infrastructure, consumed by per-bookmaker repos"
requires-python = ">=3.11"
dependencies = [
    "redis>=5.0",
    "maduna-scanner-schemas @ git+https://github.com/MadunaCapital/scanner-schemas.git#subdirectory=python",
]

# Base install (BaseScraper, ProxyConfig) has zero dependencies deliberately
# -- a bookmaker adapter that only needs a plain HTTP client (like Betway ZA's)
# shouldn't be forced to install curl_cffi/Playwright it will never use.
[project.optional-dependencies]
stealth = [
    "curl_cffi>=0.6",
    "playwright>=1.40",
    "playwright-stealth>=1.0",
    "orjson>=3.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
timeout = 15
asyncio_mode = "auto"
